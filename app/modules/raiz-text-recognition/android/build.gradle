plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.raiztextrecognition'
version = '0.1.0'

android {
  namespace "expo.modules.raiztextrecognition"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Bundled (on-device) Latin text recognizer — works offline and doesn't
  // depend on Google Play Services downloading a model at first use.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
